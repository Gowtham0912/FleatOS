plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fleettracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.fleettracker"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // ── Backend URL ────────────────────────────────────────────────────────
        // Change this to your PC's local IP address when testing on a real phone.
        // Find your IP: run `ipconfig` in cmd → look for IPv4 under your WiFi adapter
        // Example: buildConfigField "String", "BASE_URL", '"http://192.168.1.100:8000"'
        buildConfigField "String", "BASE_URL", '"https://itchy-jokes-like.loca.lt"'  // public tunnel

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Lifecycle & coroutines
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Location (FusedLocationProvider)
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // Networking — Retrofit + OkHttp + Gson
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
}
